<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS flex-flow Property Practice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="flex-flow-practice">
        <h2>Thực hành Thuộc tính CSS flex-flow</h2>

        <!-- Ví dụ 1: row nowrap -->
        <section class="flow-section">
            <h3>Ví dụ 1: flex-flow: row nowrap (Hàng từ trái sang phải, không xuống dòng)</h3>
            <div class="container-1">
                <div>1</div>
                <div>2</div>
                <div>3</div>
            </div>
        </section>

        <!-- Ví dụ 2: row-reverse nowrap -->
        <section class="flow-section">
            <h3>Ví dụ 2: flex-flow: row-reverse nowrap (Hàng ngược từ phải sang trái, không xuống dòng)</h3>
            <div class="container-2">
                <div>1</div>
                <div>2</div>
                <div>3</div>
            </div>
        </section>
    </div>
</body>
</html>
