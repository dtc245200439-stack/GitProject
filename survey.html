<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Satisfaction Survey</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Lucida Grande', 'Lucida Sans Unicode', Tahoma, sans-serif;
            background-color: #f5f7fa;
            color: #333333;
            padding: 2rem 1rem;
            line-height: 1.6;
        }
        .survey-container {
            max-width: 720px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            border-top: 6px solid #3b82f6;
            padding: 2.5rem 2rem;
        }
        .survey-header {
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 1.5rem;
            margin-bottom: 2rem;
        }
        .survey-header h1 {
            font-size: 1.75rem;
            color: #1e293b;
            margin-bottom: 0.5rem;
        }
        .survey-header p {
            color: #64748b;
            font-size: 0.95rem;
        }
        .form-group {
            margin-bottom: 1.75rem;
        }
        .form-label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #1e293b;
            font-size: 0.95rem;
        }
        .required {
            color: #ef4444;
        }
        select, input[type="text"], input[type="email"], textarea {
            width: 100%;
            padding: 0.65rem 0.85rem;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            background-color: #fff;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        select:focus, input:focus, textarea:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        .option-list {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin-top: 0.4rem;
        }
        .option-item {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: normal;
            cursor: pointer;
            font-size: 0.95rem;
            color: #334155;
        }
        /* Matrix Table Styling */
        .matrix-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 0.5rem;
        }
        .matrix-table th, .matrix-table td {
            border: 1px solid #e2e8f0;
            padding: 0.75rem 0.5rem;
            text-align: center;
            font-size: 0.9rem;
        }
        .matrix-table th {
            background-color: #f8fafc;
            color: #475569;
            font-weight: 600;
        }
        .matrix-table tr:nth-child(even) {
            background-color: #f9fafb;
        }
        .matrix-table td:first-child {
            text-align: left;
            font-weight: 600;
            padding-left: 1rem;
            color: #334155;
        }
        .btn-submit {
            background-color: #3b82f6;
            color: #ffffff;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 1rem;
        }
        .btn-submit:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body>

    <div class="survey-container">
        <header class="survey-header">
            <h1>Market Research & Customer Satisfaction Survey</h1>
            <p>Please take a few moments to complete this survey to help us improve our products and services.</p>
        </header>

        <form action="#" method="POST">
            
            <!-- Age Group -->
            <div class="form-group">
                <label class="form-label" for="age">What is your age range? <span class="required">*</span></label>
                <select id="age" name="age" required>
                    <option value="" disabled selected>-- Select Age Range --</option>
                    <option value="under-18">Under 18</option>
                    <option value="18-24">18 - 24</option>
                    <option value="25-34">25 - 34</option>
                    <option value="35-44">35 - 44</option>
                    <option value="45-54">45 - 54</option>
                    <option value="55-64">55 - 64</option>
                    <option value="65+">65 or over</option>
                </select>
            </div>

            <!-- Household Income -->
            <div class="form-group">
                <label class="form-label" for="income">What is your annual household income?</label>
                <select id="income" name="income">
                    <option value="" disabled selected>-- Select Income Range --</option>
                    <option value="0-25k">$0 - $25,000</option>
                    <option value="25k-50k">$25,001 - $50,000</option>
                    <option value="50k-75k">$50,001 - $75,000</option>
                    <option value="75k-100k">$75,001 - $100,000</option>
                    <option value="100k+">$100,001 or more</option>
                </select>
            </div>

            <!-- Gender -->
            <div class="form-group">
                <label class="form-label">Gender</label>
                <div class="option-list">
                    <label class="option-item"><input type="radio" name="gender" value="male"> Male</label>
                    <label class="option-item"><input type="radio" name="gender" value="female"> Female</label>
                    <label class="option-item"><input type="radio" name="gender" value="prefer-not-to-say"> Prefer not to say</label>
                </div>
            </div>

            <!-- Product Usage Frequency -->
            <div class="form-group">
                <label class="form-label">How often do you use our products?</label>
                <div class="option-list">
                    <label class="option-item"><input type="radio" name="usage" value="daily"> Daily</label>
                    <label class="option-item"><input type="radio" name="usage" value="weekly"> Weekly</label>
                    <label class="option-item"><input type="radio" name="usage" value="monthly"> Monthly</label>
                    <label class="option-item"><input type="radio" name="usage" value="rarely"> Rarely</label>
                    <label class="option-item"><input type="radio" name="usage" value="never"> Never</label>
                </div>
            </div>

            <!-- Satisfaction Rating Matrix -->
            <div class="form-group">
                <label class="form-label">Overall Satisfaction Rating</label>
                <table class="matrix-table">
                    <thead>
                        <tr>
                            <th>Category</th>
                            <th>Very Satisfied</th>
                            <th>Satisfied</th>
                            <th>Neutral</th>
                            <th>Unsatisfied</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Product Quality</td>
                            <td><input type="radio" name="quality" value="very-satisfied"></td>
                            <td><input type="radio" name="quality" value="satisfied"></td>
                            <td><input type="radio" name="quality" value="neutral"></td>
                            <td><input type="radio" name="quality" value="unsatisfied"></td>
                        </tr>
                        <tr>
                            <td>Customer Service</td>
                            <td><input type="radio" name="service" value="very-satisfied"></td>
                            <td><input type="radio" name="service" value="satisfied"></td>
                            <td><input type="radio" name="service" value="neutral"></td>
                            <td><input type="radio" name="service" value="unsatisfied"></td>
                        </tr>
                        <tr>
                            <td>Value for Money</td>
                            <td><input type="radio" name="value" value="very-satisfied"></td>
                            <td><input type="radio" name="value" value="satisfied"></td>
                            <td><input type="radio" name="value" value="neutral"></td>
                            <td><input type="radio" name="value" value="unsatisfied"></td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Additional Feedback -->
            <div class="form-group">
                <label class="form-label" for="comments">Do you have any additional comments or suggestions?</label>
                <textarea id="comments" name="comments" placeholder="Write your suggestions here..."></textarea>
            </div>

            <button type="submit" class="btn-submit">Submit Survey</button>
        </form>
    </div>

</body>
</html>
