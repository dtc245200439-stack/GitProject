<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Đăng Ký Người Dùng</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }
        .register-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 450px;
            padding: 2.5rem 2rem;
            border-top: 5px solid #2563eb;
        }
        h2 {
            color: #1e293b;
            text-align: center;
            margin-bottom: 0.5rem;
            font-size: 1.6rem;
        }
        .subtitle {
            color: #64748b;
            text-align: center;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        label {
            display: block;
            font-weight: 600;
            color: #334155;
            margin-bottom: 0.4rem;
            font-size: 0.95rem;
        }
        input[type="text"],
        input[type="email"],
        input[type="tel"] {
            width: 100%;
            padding: 0.75rem 0.9rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        .gender-group {
            display: flex;
            gap: 1.5rem;
            margin-top: 0.4rem;
        }
        .gender-label {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-weight: normal;
            cursor: pointer;
            color: #475569;
        }
        .btn-submit {
            width: 100%;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            padding: 0.85rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1rem;
            transition: background-color 0.2s;
        }
        .btn-submit:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="register-card">
        <h2>Đăng Ký Người Dùng</h2>
        <p class="subtitle">Vui lòng điền thông tin bên dưới để đăng ký tài khoản</p>

        <form action="http://demo.codegym.vn/6/registration_form/register.php" method="POST">
            
            <div class="form-group">
                <label for="name">Họ và tên</label>
                <input type="text" id="name" name="name" placeholder="Nhập họ và tên..." required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="example@domain.com" required>
            </div>

            <div class="form-group">
                <label for="phone">Số điện thoại</label>
                <input type="tel" id="phone" name="phone" placeholder="0901234567" required>
            </div>

            <div class="form-group">
                <label>Giới tính</label>
                <div class="gender-group">
                    <label class="gender-label">
                        <input type="radio" name="gender" value="Nam" checked> Nam
                    </label>
                    <label class="gender-label">
                        <input type="radio" name="gender" value="Nữ"> Nữ
                    </label>
                </div>
            </div>

            <button type="submit" class="btn-submit">Đăng Ký</button>
        </form>
    </div>

</body>
</html>
