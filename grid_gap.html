<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS grid-gap Property Practice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="grid-gap-practice">
        <h2>Thực hành Thuộc tính CSS grid-gap</h2>

        <!-- Ví dụ 1: Khoảng cách giữa hàng và cột bằng nhau (20px) -->
        <section class="example-section">
            <h3>Ví dụ 1: Khoảng cách hàng và cột bằng nhau (grid-gap: 20px)</h3>
            <div class="grid-gap-ex1">
                <div>Ô 1</div>
                <div>Ô 2</div>
                <div>Ô 3</div>
                <div>Ô 4</div>
            </div>
        </section>

        <!-- Ví dụ 2: Khoảng cách giữa hàng (30px) và cột (10px) khác nhau -->
        <section class="example-section">
            <h3>Ví dụ 2: Khoảng cách hàng 30px và cột 10px (grid-gap: 30px 10px)</h3>
            <div class="grid-gap-ex2">
                <div>Ô 1</div>
                <div>Ô 2</div>
                <div>Ô 3</div>
                <div>Ô 4</div>
                <div>Ô 5</div>
                <div>Ô 6</div>
            </div>
        </section>
    </div>
</body>
</html>
