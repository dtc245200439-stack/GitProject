<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS flex-grow Property Practice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="flex-grow-practice">
        <h2>Thực hành Thuộc tính CSS flex-grow</h2>
        <p>Tạo vùng chứa gồm 5 Flex Items, áp dụng <code>flex-grow</code> trên div thứ 2 giúp ô này tăng chiều rộng phát triển vượt trội so với 4 ô còn lại.</p>

        <div class="grow-container">
            <div class="grow-item">Item 1</div>
            <div class="grow-item grow-target">Item 2 (flex-grow: 3)</div>
            <div class="grow-item">Item 3</div>
            <div class="grow-item">Item 4</div>
            <div class="grow-item">Item 5</div>
        </div>
    </div>
</body>
</html>
