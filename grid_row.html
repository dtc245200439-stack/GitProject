<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Row Property Practice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="grid-practice-wrapper">
        <h2>Thực hành Thuộc tính CSS grid-row</h2>
        <p>Ô 1 sử dụng thuộc tính <code>grid-row: 1 / 3</code> (hoặc <code>span 2</code>) để chiếm 2 hàng liên tiếp trong Grid Layout.</p>

        <div class="grid-container">
            <div class="item item1">Ô 1 (Occupies 2 Rows)</div>
            <div class="item">Ô 2</div>
            <div class="item">Ô 3</div>
            <div class="item">Ô 4</div>
            <div class="item">Ô 5</div>
            <div class="item">Ô 6</div>
        </div>
    </div>
</body>
</html>
